{{- if .Values.networkPolicy.enabled }}
# =============================================================================
# Network Policies for AKS Store Demo
# Restricts inter-service communication for improved security
# =============================================================================
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-deny-all
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS resolution
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-allow-dns
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Store Front Network Policy
# Allows ingress from ingress controller, egress to product-service and order-service
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-store-front
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: store-front
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    {{- with .Values.networkPolicy.ingressFrom }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow traffic to product-service
    - to:
        - podSelector:
            matchLabels:
              app: product-service
      ports:
        - protocol: TCP
          port: 3002
    # Allow traffic to order-service
    - to:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 3000
---
# Order Service Network Policy
# Allows ingress from store-front, egress to rabbitmq
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-order-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: store-front
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
# Product Service Network Policy
# Allows ingress from store-front
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-product-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: store-front
      ports:
        - protocol: TCP
          port: 3002
  egress:
    # Allow all egress for product-service (no dependencies)
    - {}
---
# RabbitMQ Network Policy
# Allows ingress from order-service
apiVersion: {{ include "aks-store-demo.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "aks-store-demo.fullname" . }}-rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aks-store-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
{{- end }}
