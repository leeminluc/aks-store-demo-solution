# =============================================================================
# AKS Store Demo - Helm Values
# =============================================================================

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
global:
  namespace: store-demo
  environment: dev
  imageRegistry: ghcr.io/azure-samples/aks-store-demo
  imageTag: "2.0.0"
  imagePullSecrets: []

# -----------------------------------------------------------------------------
# Network Policies
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Allow ingress traffic from specific namespaces
  ingressFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       name: ingress-nginx

# -----------------------------------------------------------------------------
# Security Contexts
# -----------------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Store Front (Web Frontend)
# -----------------------------------------------------------------------------
storeFront:
  enabled: true
  replicaCount: 2
  
  image:
    repository: store-front
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    - name: PRODUCT_SERVICE_URL
      value: "http://product-service:3002/"
    - name: ORDER_SERVICE_URL
      value: "http://order-service:3000/"
  
  probes:
    startup:
      httpGet:
        path: /health
        port: 8080
      failureThreshold: 30
      initialDelaySeconds: 5
      periodSeconds: 5
    readiness:
      httpGet:
        path: /health
        port: 8080
      failureThreshold: 3
      initialDelaySeconds: 3
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 8080
      failureThreshold: 5
      initialDelaySeconds: 10
      periodSeconds: 10

# -----------------------------------------------------------------------------
# Store Admin (Admin Dashboard)
# -----------------------------------------------------------------------------
storeAdmin:
  enabled: true
  replicaCount: 1
  
  image:
    repository: store-admin
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 8081
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  env:
    - name: MAKELINE_SERVICE_URL
      value: "http://makeline-service:3001/"
    - name: ORDER_SERVICE_URL
      value: "http://order-service:3000/"
  
  probes:
    startup:
      httpGet:
        path: /health
        port: 8081
      failureThreshold: 30
      initialDelaySeconds: 5
      periodSeconds: 5
    readiness:
      httpGet:
        path: /health
        port: 8081
      failureThreshold: 3
      initialDelaySeconds: 3
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 8081
      failureThreshold: 5
      initialDelaySeconds: 10
      periodSeconds: 10

# -----------------------------------------------------------------------------
# Order Service
# -----------------------------------------------------------------------------
orderService:
  enabled: true
  replicaCount: 2
  
  image:
    repository: order-service
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  
  env:
    - name: ORDER_QUEUE_HOSTNAME
      value: "rabbitmq"
    - name: ORDER_QUEUE_PORT
      value: "5672"
    - name: ORDER_QUEUE_USERNAME
      valueFrom:
        secretKeyRef:
          name: rabbitmq-credentials
          key: username
    - name: ORDER_QUEUE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: rabbitmq-credentials
          key: password
    - name: ORDER_QUEUE_NAME
      value: "orders"
    - name: FASTIFY_ADDRESS
      value: "0.0.0.0"
  
  probes:
    startup:
      httpGet:
        path: /health
        port: 3000
      failureThreshold: 5
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      httpGet:
        path: /health
        port: 3000
      failureThreshold: 3
      initialDelaySeconds: 3
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 3000
      failureThreshold: 5
      initialDelaySeconds: 3
      periodSeconds: 10

# -----------------------------------------------------------------------------
# Product Service
# -----------------------------------------------------------------------------
productService:
  enabled: true
  replicaCount: 1
  
  image:
    repository: product-service
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3002
  
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
  
  env:
    - name: AI_SERVICE_URL
      value: "http://ai-service:5001/"
  
  probes:
    readiness:
      httpGet:
        path: /health
        port: 3002
      failureThreshold: 3
      initialDelaySeconds: 3
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 3002
      failureThreshold: 5
      initialDelaySeconds: 3
      periodSeconds: 10

# -----------------------------------------------------------------------------
# Makeline Service
# -----------------------------------------------------------------------------
makelineService:
  enabled: true
  replicaCount: 1
  
  image:
    repository: makeline-service
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3001
  
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  
  env:
    - name: ORDER_QUEUE_URI
      value: "amqp://rabbitmq:5672"
    - name: ORDER_QUEUE_USERNAME
      valueFrom:
        secretKeyRef:
          name: rabbitmq-credentials
          key: username
    - name: ORDER_QUEUE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: rabbitmq-credentials
          key: password
    - name: ORDER_QUEUE_NAME
      value: "orders"
    - name: ORDER_DB_URI
      value: "mongodb://mongodb:27017"
    - name: ORDER_DB_NAME
      value: "orderdb"
    - name: ORDER_DB_COLLECTION_NAME
      value: "orders"
  
  probes:
    readiness:
      httpGet:
        path: /health
        port: 3001
      failureThreshold: 3
      initialDelaySeconds: 3
      periodSeconds: 5
    liveness:
      httpGet:
        path: /health
        port: 3001
      failureThreshold: 5
      initialDelaySeconds: 3
      periodSeconds: 10

# -----------------------------------------------------------------------------
# AI Service (Optional)
# -----------------------------------------------------------------------------
aiService:
  enabled: false
  replicaCount: 1
  
  image:
    repository: ai-service
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5001
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -----------------------------------------------------------------------------
# Virtual Customer (Load Generator)
# -----------------------------------------------------------------------------
virtualCustomer:
  enabled: true
  replicaCount: 1
  
  image:
    repository: virtual-customer
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  
  env:
    - name: ORDER_SERVICE_URL
      value: "http://order-service:3000/"
    - name: ORDERS_PER_HOUR
      value: "20"

# -----------------------------------------------------------------------------
# Virtual Worker (Load Generator)
# -----------------------------------------------------------------------------
virtualWorker:
  enabled: true
  replicaCount: 1
  
  image:
    repository: virtual-worker
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  
  env:
    - name: MAKELINE_SERVICE_URL
      value: "http://makeline-service:3001/"
    - name: ORDERS_PER_HOUR
      value: "10"

# -----------------------------------------------------------------------------
# RabbitMQ (Message Queue)
# -----------------------------------------------------------------------------
rabbitmq:
  enabled: true
  
  auth:
    username: username
    password: password
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# -----------------------------------------------------------------------------
# MongoDB (Database)
# -----------------------------------------------------------------------------
mongodb:
  enabled: true
  
  auth:
    enabled: false
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  
  hosts:
    - host: store.local
      paths:
        - path: /
          pathType: Prefix
          service: store-front
          port: 80
    - host: admin.store.local
      paths:
        - path: /
          pathType: Prefix
          service: store-admin
          port: 80
  
  tls: []
  # - secretName: store-tls
  #   hosts:
  #     - store.local

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  rabbitmq:
    create: true
    username: username
    password: password