# =============================================================================
# Ingress Resources for AKS Store Demo
# This file defines the Ingress rules to route traffic to the application services
# Prerequisite: NGINX Ingress Controller must be installed via Helm
# =============================================================================

---
# Ingress for Store Front (Web Frontend)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-front-ingress
  namespace: store-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-front
                port:
                  number: 80

---
# Ingress for Store Admin (Admin Dashboard)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-admin-ingress
  namespace: store-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /admin
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: store-admin
                port:
                  number: 80

---
# Ingress for RabbitMQ Management UI (Optional - for debugging)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management-ingress
  namespace: store-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /rabbitmq
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672