version: '3.8'

# Local Development Docker Compose
# Usage:
#   1. Login to ACR: az acr login --name <acr-name>
#   2. Set environment variables:
#      export ACR_REGISTRY=<acr-name>.azurecr.io
#      export IMAGE_TAG=latest
#   3. Run: docker-compose up -d

services:
  # Frontend Services
  store-front:
    image: ${ACR_REGISTRY}/store-front:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:3002/
      - ORDER_SERVICE_URL=http://order-service:3000/
    depends_on:
      - product-service
      - order-service
    networks:
      - store-network

  # Backend Services
  order-service:
    image: ${ACR_REGISTRY}/order-service:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      - ORDER_QUEUE_HOSTNAME=rabbitmq
      - ORDER_QUEUE_PORT=5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=orders
      - FASTIFY_ADDRESS=0.0.0.0
    depends_on:
      - rabbitmq
    networks:
      - store-network

  product-service:
    image: ${ACR_REGISTRY}/product-service:${IMAGE_TAG:-latest}
    ports:
      - "3002:3002"
    networks:
      - store-network

  # Message Queue
  rabbitmq:
    image: mcr.microsoft.com/azurelinux/base/rabbitmq-server:3.13
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=username
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - store-network

# Networks
networks:
  store-network:
    driver: bridge

# Volumes
volumes:
  rabbitmq_data:
