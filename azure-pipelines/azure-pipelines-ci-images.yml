# AKS Store Demo - CI Pipeline for Docker Images

trigger: none
pr: none

resources:
  repositories:
    - repository: aks-store-demo
      type: github
      name: 'Azure-Samples/aks-store-demo'
      endpoint: 'github-connection'

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: acrConnection
    value: 'acr-connection'
  - name: containerRegistry
    value: '$(containerRegistryName).azurecr.io'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: srcPath
    value: '$(Build.SourcesDirectory)/aks-store-demo/src'

stages:
  - stage: CI
    displayName: Build and Push Images
    jobs:
      - job: BuildTestPush
        displayName: Build, Test and Push
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: aks-store-demo
            displayName: 'Checkout aks-store-demo source code'

          - checkout: self
            displayName: 'Checkout solution repository'

          - script: |
              echo "Building images with ACR tags..."
              docker build -t $(containerRegistry)/store-front:test-$(imageTag) -t $(containerRegistry)/store-front:latest $(srcPath)/store-front
              docker build -t $(containerRegistry)/order-service:test-$(imageTag) -t $(containerRegistry)/order-service:latest $(srcPath)/order-service
              docker build -t $(containerRegistry)/product-service:test-$(imageTag) -t $(containerRegistry)/product-service:latest $(srcPath)/product-service
              echo "Build complete!"
            displayName: 'Build Docker images with ACR tags'

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          - script: |
              echo "Pushing test images to ACR..."
              docker push $(containerRegistry)/store-front:test-$(imageTag)
              docker push $(containerRegistry)/order-service:test-$(imageTag)
              docker push $(containerRegistry)/product-service:test-$(imageTag)
              echo "Push complete!"
            displayName: 'Push test images to ACR'

          - script: |
              echo "Pulling images from ACR..."
              docker pull $(containerRegistry)/store-front:test-$(imageTag)
              docker pull $(containerRegistry)/order-service:test-$(imageTag)
              docker pull $(containerRegistry)/product-service:test-$(imageTag)
              
              echo "Tagging images for Docker Compose..."
              docker tag $(containerRegistry)/store-front:test-$(imageTag) aksstoredemo_store-front:latest
              docker tag $(containerRegistry)/order-service:test-$(imageTag) aksstoredemo_order-service:latest
              docker tag $(containerRegistry)/product-service:test-$(imageTag) aksstoredemo_product-service:latest
              echo "Tag complete!"
            displayName: 'Pull and tag images for testing'

          - task: DockerCompose@0
            displayName: 'Start services for testing'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose-quickstart.yml'
              projectName: 'aks-store-demo'
              action: 'Run services'
              buildImages: false

          - script: |
              echo "Waiting for services to be ready..."
              sleep 30
              echo "Testing store-front..."
              curl -f http://localhost:8080/health || exit 1
              echo "Testing order-service..."
              curl -f http://localhost:3000/health || exit 1
              echo "Testing product-service..."
              curl -f http://localhost:3002/health || exit 1
              echo "All tests passed!"
            displayName: 'Run health check tests'

          - task: DockerCompose@0
            displayName: 'Stop services'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose-quickstart.yml'
              projectName: 'aks-store-demo'
              action: 'Run a Docker Compose command'
              dockerComposeCommand: 'down'

          - script: |
              echo "Pushing production tags to ACR..."
              docker push $(containerRegistry)/store-front:latest
              docker push $(containerRegistry)/order-service:latest
              docker push $(containerRegistry)/product-service:latest
              echo "Production images pushed!"
            displayName: 'Push production tags to ACR'

          - script: |
              echo "Tests failed! Cleaning up test images from ACR..."
              az acr repository delete --name $(containerRegistryName) --image store-front:test-$(imageTag) --yes || true
              az acr repository delete --name $(containerRegistryName) --image order-service:test-$(imageTag) --yes || true
              az acr repository delete --name $(containerRegistryName) --image product-service:test-$(imageTag) --yes || true
              echo "Cleanup complete!"
            displayName: 'Cleanup test images on failure'
            condition: failed()
