# AKS Store Demo - CI Pipeline for Helm Chart
# Packages and publishes Helm chart as build artifact

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - kubernetes/helm-chart/
      - azure-pipelines/azure-pipelines-ci-helm.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - kubernetes/helm-chart/
      - azure-pipelines/azure-pipelines-ci-helm.yml

variables:
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: PublishHelm
    displayName: Package and Publish Helm Chart
    jobs:
      - job: Publish
        displayName: Package and Publish Helm Chart
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            displayName: 'Checkout solution repository'

          - script: |
              echo "Preparing Helm chart..."
              cd $(Build.SourcesDirectory)/kubernetes/helm-chart
              
              # Download dependencies
              echo "Downloading Helm dependencies..."
              helm dependency update
              
              echo "Helm chart contents:"
              ls -la
            displayName: 'Prepare Helm chart'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Helm Chart Artifact'
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/kubernetes/helm-chart'
              ArtifactName: 'helm-chart'
              publishLocation: 'Container'
