# AKS Store Demo - CI Pipeline

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines/azure-pipelines-ci.yml
      - kubernetes/helm-chart/

pr:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines/azure-pipelines-ci.yml
      - kubernetes/helm-chart/

resources:
  repositories:
    - repository: aks-store-demo
      type: github
      name: 'Azure-Samples/aks-store-demo'
      endpoint: 'github-connection'

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: acrConnection
    value: 'acr-connection'
  - name: containerRegistry
    value: '$(containerRegistryName).azurecr.io'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: srcPath
    value: '$(Build.SourcesDirectory)/aks-store-demo/src'

stages:
  - stage: CI
    displayName: CI Pipeline
    jobs:
      - job: BuildTestPush
        displayName: Build, Test and Push
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: aks-store-demo
            displayName: 'Checkout aks-store-demo source code'

          - checkout: self
            displayName: 'Checkout solution repository'

          - task: Docker@2
            displayName: Build store-front image
            inputs:
              command: 'build'
              Dockerfile: '$(srcPath)/store-front/Dockerfile'
              buildContext: '$(srcPath)/store-front'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build order-service image
            inputs:
              command: 'build'
              Dockerfile: '$(srcPath)/order-service/Dockerfile'
              buildContext: '$(srcPath)/order-service'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build product-service image
            inputs:
              command: 'build'
              Dockerfile: '$(srcPath)/product-service/Dockerfile'
              buildContext: '$(srcPath)/product-service'
              tags: |
                $(imageTag)
                latest

          - task: DockerCompose@0
            displayName: 'Start services for testing'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose-quickstart.yml'
              projectName: 'aks-store-demo'
              action: 'Run services'
              buildImages: false

          - script: |
              echo "Waiting for services to be ready..."
              sleep 30
              echo "Testing store-front..."
              curl -f http://localhost:8080/health || exit 1
              echo "Testing order-service..."
              curl -f http://localhost:3000/health || exit 1
              echo "Testing product-service..."
              curl -f http://localhost:3002/health || exit 1
              echo "All tests passed!"
            displayName: 'Run health check tests'

          - task: DockerCompose@0
            displayName: 'Stop services'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose-quickstart.yml'
              projectName: 'aks-store-demo'
              action: 'Run a Docker Compose command'
              dockerComposeCommand: 'down'

          - script: |
              echo "Tagging images for ACR..."
              docker tag store-front:$(imageTag) $(containerRegistry)/store-front:$(imageTag)
              docker tag store-front:latest $(containerRegistry)/store-front:latest
              docker tag order-service:$(imageTag) $(containerRegistry)/order-service:$(imageTag)
              docker tag order-service:latest $(containerRegistry)/order-service:latest
              docker tag product-service:$(imageTag) $(containerRegistry)/product-service:$(imageTag)
              docker tag product-service:latest $(containerRegistry)/product-service:latest
              echo "Images tagged successfully!"
            displayName: 'Tag images for ACR'

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          - script: |
              echo "Pushing images to ACR..."
              docker push $(containerRegistry)/store-front:$(imageTag)
              docker push $(containerRegistry)/store-front:latest
              docker push $(containerRegistry)/order-service:$(imageTag)
              docker push $(containerRegistry)/order-service:latest
              docker push $(containerRegistry)/product-service:$(imageTag)
              docker push $(containerRegistry)/product-service:latest
              echo "Images pushed successfully!"
            displayName: 'Push images to ACR'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Helm Chart'
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/s/kubernetes/helm-chart'
              ArtifactName: 'helm-chart'
              publishLocation: 'Container'
