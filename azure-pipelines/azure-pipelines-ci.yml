# AKS Store Demo - CI Pipeline

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/

pr:
  branches:
    include:
      - main

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: acrConnection
    value: 'acr-connection'
  - name: containerRegistry
    value: '$(containerRegistryName).azurecr.io'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  # Build Stage
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: Build
        displayName: Build Services
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          - task: Docker@2
            displayName: Build and push store-front image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'store-front'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/src/store-front/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/store-front'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push store-admin image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'store-admin'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/src/store-admin/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/store-admin'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push order-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'order-service'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/src/order-service/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/order-service'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push product-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'product-service'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/src/product-service/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/product-service'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push makeline-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'makeline-service'
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/src/makeline-service/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/makeline-service'
              tags: |
                $(imageTag)
                latest

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Kubernetes Manifests'
            inputs:
              PathtoPublish: 'kubernetes/manifests'
              ArtifactName: 'kubernetes-manifests'
              publishLocation: 'Container'
