# AKS Store Demo - CI Pipeline

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: aks-store-demo
      type: github
      name: 'Azure-Samples/aks-store-demo'
      endpoint: 'github-connection'

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: acrConnection
    value: 'acr-connection'
  - name: containerRegistry
    value: '$(containerRegistryName).azurecr.io'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: srcPath
    value: '$(Build.SourcesDirectory)/aks-store-demo/src'

stages:
  # Build Stage
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: Build
        displayName: Build Services
        pool:
          vmImage: $(vmImageName)
        steps:
          # Checkout the source code repository
          - checkout: aks-store-demo
            displayName: 'Checkout aks-store-demo source code'

          # Checkout self for kubernetes manifests
          - checkout: self
            displayName: 'Checkout solution repository'

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          - task: Docker@2
            displayName: Build and push store-front image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'store-front'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/store-front/Dockerfile'
              buildContext: '$(srcPath)/store-front'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push store-admin image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'store-admin'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/store-admin/Dockerfile'
              buildContext: '$(srcPath)/store-admin'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push order-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'order-service'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/order-service/Dockerfile'
              buildContext: '$(srcPath)/order-service'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push product-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'product-service'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/product-service/Dockerfile'
              buildContext: '$(srcPath)/product-service'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build and push makeline-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'makeline-service'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/makeline-service/Dockerfile'
              buildContext: '$(srcPath)/makeline-service'
              tags: |
                $(imageTag)
                latest

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Kubernetes Manifests'
            inputs:
              PathtoPublish: 'kubernetes/manifests'
              ArtifactName: 'kubernetes-manifests'
              publishLocation: 'Container'
