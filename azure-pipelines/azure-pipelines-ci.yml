# AKS Store Demo - CI Pipeline

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines/azure-pipelines-ci.yml
      - kubernetes/helm-chart/

pr:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines/azure-pipelines-ci.yml
      - kubernetes/helm-chart/

resources:
  repositories:
    - repository: aks-store-demo
      type: github
      name: 'Azure-Samples/aks-store-demo'
      endpoint: 'github-connection'

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: acrConnection
    value: 'acr-connection'
  - name: containerRegistry
    value: '$(containerRegistryName).azurecr.io'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: srcPath
    value: '$(Build.SourcesDirectory)/aks-store-demo/src'

stages:
  - stage: Test
    displayName: Test Stage
    jobs:
      - job: Test
        displayName: Build and Test Application
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: aks-store-demo
            displayName: 'Checkout aks-store-demo source code'

          - checkout: self
            displayName: 'Checkout solution repository'

          # Start services using docker-compose for testing
          - task: DockerCompose@0
            displayName: 'Build and start services for testing'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose.yml'
              projectName: 'aks-store-demo'
              action: 'Run services'
              buildImages: true

          # Run health check tests
          - script: |
              echo "Waiting for services to be ready..."
              sleep 30
              echo "Testing store-front..."
              curl -f http://localhost:8080/health || exit 1
              echo "Testing order-service..."
              curl -f http://localhost:3000/health || exit 1
              echo "Testing product-service..."
              curl -f http://localhost:3002/health || exit 1
              echo "All tests passed!"
            displayName: 'Run health check tests'

          # Stop services
          - task: DockerCompose@0
            displayName: 'Stop services'
            inputs:
              containerregistrytype: 'Container Registry'
              dockerComposeFile: '$(Build.SourcesDirectory)/aks-store-demo/docker-compose.yml'
              action: 'Run a Docker Compose command'
              dockerComposeCommand: 'down'

  - stage: Push
    displayName: Push Stage
    dependsOn: Test
    jobs:
      - job: Push
        displayName: Build and Push Images to ACR
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: aks-store-demo
            displayName: 'Checkout aks-store-demo source code'

          - checkout: self
            displayName: 'Checkout solution repository'

          # Login to ACR
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrConnection)

          # Build and push store-front
          - task: Docker@2
            displayName: Build and push store-front image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'store-front'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/store-front/Dockerfile'
              buildContext: '$(srcPath)/store-front'
              tags: |
                $(imageTag)
                latest

          # Build and push order-service
          - task: Docker@2
            displayName: Build and push order-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'order-service'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/order-service/Dockerfile'
              buildContext: '$(srcPath)/order-service'
              tags: |
                $(imageTag)
                latest

          # Build and push product-service
          - task: Docker@2
            displayName: Build and push product-service image
            inputs:
              containerRegistry: $(acrConnection)
              repository: 'product-service'
              command: 'buildAndPush'
              Dockerfile: '$(srcPath)/product-service/Dockerfile'
              buildContext: '$(srcPath)/product-service'
              tags: |
                $(imageTag)
                latest

          # Publish Helm chart
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Helm Chart'
            inputs:
              PathtoPublish: 'kubernetes/helm-chart'
              ArtifactName: 'helm-chart'
              publishLocation: 'Container'
