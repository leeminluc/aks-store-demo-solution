# AKS Store Demo - CD Pipeline

trigger:
  none

resources:
  pipelines:
    - pipeline: ci-pipeline
      source: 'aks-store-demo-ci'
      trigger:
        stages:
          - Build

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(resources.pipeline.ci-pipeline.runID)'
  - name: azureSubscription
    value: 'azure-connection'
  - name: kubernetesNamespace
    value: 'store-demo'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  # ---------------------------------------------------------------------------
  # Deploy to AKS
  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Deploy to AKS
    jobs:
      - deployment: Deploy
        displayName: Deploy to AKS
        environment: 'aks-store-demo'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: ci-pipeline
                  artifact: kubernetes-manifests
                  patterns: '**/*.yaml'

                - task: KubernetesManifest@1
                  displayName: Create namespace if not exists
                  inputs:
                    action: 'deploy'
                    connectionType: 'azureResourceManager'
                    azureSubscriptionConnection: $(azureSubscription)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: 'default'
                    manifests: |
                      $(Pipeline.Workspace)/kubernetes-manifests/namespace.yaml

                - task: KubernetesManifest@1
                  displayName: Deploy application
                  inputs:
                    action: 'deploy'
                    connectionType: 'azureResourceManager'
                    azureSubscriptionConnection: $(azureSubscription)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(kubernetesNamespace)
                    manifests: |
                      $(Pipeline.Workspace)/kubernetes-manifests/ingress.yaml
                    containers: |
                      $(containerRegistry)/store-front:$(imageTag)
                      $(containerRegistry)/store-admin:$(imageTag)
                      $(containerRegistry)/order-service:$(imageTag)
                      $(containerRegistry)/product-service:$(imageTag)
                      $(containerRegistry)/makeline-service:$(imageTag)

  # Verify Deployment
  - stage: Verify
    displayName: Verify Deployment
    dependsOn: Deploy
    jobs:
      - job: Verify
        displayName: Verify Deployment Health
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Kubernetes@1
            displayName: Check deployment status
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: $(azureSubscription)
              azureResourceGroup: $(resourceGroup)
              kubernetesCluster: $(aksCluster)
              command: 'get'
              arguments: 'pods -n $(kubernetesNamespace)'
              outputFormat: 'jsonpath={.items[*].status.phase}'

          - script: |
              echo "Deployment completed!"
              echo "Image Tag: $(imageTag)"
              echo "Namespace: $(kubernetesNamespace)"
            displayName: 'Print deployment summary'
