# AKS Store Demo - CD Pipeline

trigger:
  none

resources:
  pipelines:
    - pipeline: ci-helm
      source: 'aks-store-demo-ci-helm'
      trigger:
        stages:
          - PublishHelm

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: 'latest'
  - name: azureSubscription
    value: 'azure-connection'
  - name: kubernetesNamespace
    value: 'store-demo'
  - name: helmReleaseName
    value: 'aks-store-demo'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  # Deploy to AKS using Helm
  - stage: Deploy
    displayName: Deploy to AKS
    jobs:
      - deployment: Deploy
        displayName: Deploy to AKS with Helm
        environment: 'aks-store-demo'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: 'Checkout solution repository'

                - download: ci-helm
                  artifact: helm-chart
                  patterns: '**/*'

                # Install kubelogin for Azure AD-enabled AKS clusters
                - script: |
                    curl -LO "https://github.com/Azure/kubelogin/releases/download/v0.0.26/kubelogin-linux-amd64.zip"
                    unzip kubelogin-linux-amd64.zip
                    sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
                    rm -rf kubelogin-linux-amd64.zip bin
                    kubelogin --version
                  displayName: 'Install kubelogin'

                # Install Helm
                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: '3.13.0'

                # Deploy using Helm
                - task: HelmDeploy@0
                  displayName: 'Deploy application with Helm'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: $(azureSubscription)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(kubernetesNamespace)
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/ci-helm/helm-chart'
                    releaseName: $(helmReleaseName)
                    install: true
                    force: true
                    valueFile: '$(Pipeline.Workspace)/ci-helm/helm-chart/values.yaml'
                    overrideValues: |
                      global.imageRegistry=$(containerRegistry)
                      global.imageTag=$(imageTag)
                      ingress.enabled=true
                      ingress.className=nginx
                      networkPolicy.enabled=true
                    arguments: '--timeout 5m --wait --create-namespace'

  # Verify Deployment
  - stage: Verify
    displayName: Verify Deployment
    dependsOn: Deploy
    jobs:
      - job: Verify
        displayName: Verify Deployment Health
        pool:
          vmImage: $(vmImageName)
        steps:
          # Install kubelogin for Azure AD-enabled AKS clusters
          - script: |
              curl -LO "https://github.com/Azure/kubelogin/releases/download/v0.0.26/kubelogin-linux-amd64.zip"
              unzip kubelogin-linux-amd64.zip
              sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
              rm -rf kubelogin-linux-amd64.zip bin
              kubelogin --version
            displayName: 'Install kubelogin'

          - task: Kubernetes@1
            displayName: 'Check deployment status'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: $(azureSubscription)
              azureResourceGroup: $(resourceGroup)
              kubernetesCluster: $(aksCluster)
              command: 'get'
              arguments: 'pods -n $(kubernetesNamespace)'
              outputFormat: 'jsonpath={.items[*].status.phase}'

          - task: Kubernetes@1
            displayName: 'Check Helm release status'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: $(azureSubscription)
              azureResourceGroup: $(resourceGroup)
              kubernetesCluster: $(aksCluster)
              command: 'get'
              arguments: 'all -n $(kubernetesNamespace)'

          - script: |
              echo "=========================================="
              echo "Deployment completed successfully!"
              echo "=========================================="
              echo "Image Tag: $(imageTag)"
              echo "Namespace: $(kubernetesNamespace)"
              echo "Helm Release: $(helmReleaseName)"
              echo ""
              echo "Features deployed:"
              echo "  - Resource limits for all containers"
              echo "  - Network policies for inter-service security"
              echo "  - Security contexts (runAsNonRoot)"
              echo "  - Health probes (startup, readiness, liveness)"
              echo "=========================================="
            displayName: 'Print deployment summary'
