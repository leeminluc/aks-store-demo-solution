# AKS Store Demo - CD Pipeline

trigger:
  none

resources:
  pipelines:
    - pipeline: ci-helm
      source: 'aks-store-demo-ci-helm'
      trigger:
        stages:
          - PublishHelm

variables:
  - group: aks-store-demo-variables
  - name: imageTag
    value: '$(resources.pipeline.ci-helm.runID)'
  - name: azureSubscription
    value: 'azure-connection'
  - name: kubernetesNamespace
    value: 'store-demo'
  - name: helmReleaseName
    value: 'aks-store-demo'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  # Deploy to AKS using Helm
  - stage: Deploy
    displayName: Deploy to AKS
    jobs:
      - deployment: Deploy
        displayName: Deploy to AKS with Helm
        environment: 'aks-store-demo'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: 'Checkout solution repository'

                - download: ci-helm
                  artifact: helm-chart
                  patterns: '**/*'

                # Add agent IP to AKS authorized IP ranges
                - task: AzureCLI@2
                  displayName: 'Add Agent IP to AKS Authorized IPs'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Get current agent IP
                      AGENT_IP=$(curl -s https://api.ipify.org)
                      echo "Agent IP: $AGENT_IP"
                      
                      # Get current authorized IP ranges
                      CURRENT_IPS=$(az aks show --resource-group $(resourceGroup) --name $(aksCluster) --query "apiServerAccessProfile.authorizedIpRanges" -o tsv | tr '\n' ',' | sed 's/,$//')
                      echo "Current authorized IPs: $CURRENT_IPS"
                      
                      # Add agent IP if not already present
                      if [ -z "$CURRENT_IPS" ] || [ "$CURRENT_IPS" == "null" ]; then
                        NEW_IPS="$AGENT_IP/32"
                      else
                        if [[ "$CURRENT_IPS" == *"$AGENT_IP"* ]]; then
                          echo "Agent IP already in authorized list"
                          NEW_IPS="$CURRENT_IPS"
                        else
                          NEW_IPS="$CURRENT_IPS,$AGENT_IP/32"
                        fi
                      fi
                      
                      echo "Updating authorized IPs to: $NEW_IPS"
                      az aks update --resource-group $(resourceGroup) --name $(aksCluster) --api-server-authorized-ip-ranges "$NEW_IPS"
                      
                      # Wait for update to propagate
                      echo "Waiting 60 seconds for IP update to propagate..."
                      sleep 60
                      
                      echo "Agent IP added successfully"

                # Install kubelogin for Azure AD-enabled AKS clusters
                - script: |
                    curl -LO "https://github.com/Azure/kubelogin/releases/download/v0.0.26/kubelogin-linux-amd64.zip"
                    unzip kubelogin-linux-amd64.zip
                    sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
                    rm -rf kubelogin-linux-amd64.zip bin
                    kubelogin --version
                  displayName: 'Install kubelogin'

                # Install Helm
                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: '3.13.0'

                # Update Helm dependencies
                - script: |
                    cd $(Pipeline.Workspace)/ci-helm/helm-chart
                    helm dependency update
                  displayName: 'Update Helm dependencies'

                # Deploy using Helm
                - task: HelmDeploy@0
                  displayName: 'Deploy application with Helm'
                  inputs:
                    connectionType: 'Azure Resource Manager'
                    azureSubscription: $(azureSubscription)
                    azureResourceGroup: $(resourceGroup)
                    kubernetesCluster: $(aksCluster)
                    namespace: $(kubernetesNamespace)
                    command: 'upgrade'
                    chartType: 'FilePath'
                    chartPath: '$(Pipeline.Workspace)/ci-helm/helm-chart'
                    releaseName: $(helmReleaseName)
                    install: true
                    force: true
                    valueFile: '$(Pipeline.Workspace)/ci-helm/helm-chart/values.yaml'
                    overrideValues: |
                      global.imageRegistry=$(containerRegistry)
                      global.imageTag=$(imageTag)
                      ingress.enabled=true
                      ingress.className=nginx
                      networkPolicy.enabled=true
                    arguments: '--timeout 5m --wait'

  # Verify Deployment
  - stage: Verify
    displayName: Verify Deployment
    dependsOn: Deploy
    jobs:
      - job: Verify
        displayName: Verify Deployment Health
        pool:
          vmImage: $(vmImageName)
        steps:
          # Add agent IP to AKS authorized IP ranges
          - task: AzureCLI@2
            displayName: 'Add Agent IP to AKS Authorized IPs'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get current agent IP
                AGENT_IP=$(curl -s https://api.ipify.org)
                echo "Agent IP: $AGENT_IP"
                
                # Get current authorized IP ranges (convert newlines to commas)
                CURRENT_IPS=$(az aks show --resource-group $(resourceGroup) --name $(aksCluster) --query "apiServerAccessProfile.authorizedIpRanges" -o tsv | tr '\n' ',' | sed 's/,$//')
                echo "Current authorized IPs: $CURRENT_IPS"
                
                # Add agent IP if not already present
                if [ -z "$CURRENT_IPS" ] || [ "$CURRENT_IPS" == "null" ]; then
                  NEW_IPS="$AGENT_IP/32"
                else
                  if [[ "$CURRENT_IPS" == *"$AGENT_IP"* ]]; then
                    echo "Agent IP already in authorized list"
                    NEW_IPS="$CURRENT_IPS"
                  else
                    NEW_IPS="$CURRENT_IPS,$AGENT_IP/32"
                  fi
                fi
                
                echo "Updating authorized IPs to: $NEW_IPS"
                az aks update --resource-group $(resourceGroup) --name $(aksCluster) --api-server-authorized-ip-ranges "$NEW_IPS"
                
                # Wait for update to propagate
                echo "Waiting 60 seconds for IP update to propagate..."
                sleep 60
                
                echo "Agent IP added successfully"

          # Install kubelogin for Azure AD-enabled AKS clusters
          - script: |
              curl -LO "https://github.com/Azure/kubelogin/releases/download/v0.0.26/kubelogin-linux-amd64.zip"
              unzip kubelogin-linux-amd64.zip
              sudo mv bin/linux_amd64/kubelogin /usr/local/bin/
              rm -rf kubelogin-linux-amd64.zip bin
              kubelogin --version
            displayName: 'Install kubelogin'

          - task: Kubernetes@1
            displayName: 'Check deployment status'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: $(azureSubscription)
              azureResourceGroup: $(resourceGroup)
              kubernetesCluster: $(aksCluster)
              command: 'get'
              arguments: 'pods -n $(kubernetesNamespace)'
              outputFormat: 'jsonpath={.items[*].status.phase}'

          - task: Kubernetes@1
            displayName: 'Check Helm release status'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: $(azureSubscription)
              azureResourceGroup: $(resourceGroup)
              kubernetesCluster: $(aksCluster)
              command: 'get'
              arguments: 'all -n $(kubernetesNamespace)'

          - script: |
              echo "=========================================="
              echo "Deployment completed successfully!"
              echo "=========================================="
              echo "Image Tag: $(imageTag)"
              echo "Namespace: $(kubernetesNamespace)"
              echo "Helm Release: $(helmReleaseName)"
              echo ""
              echo "Features deployed:"
              echo "  - Resource limits for all containers"
              echo "  - Network policies for inter-service security"
              echo "  - Security contexts (runAsNonRoot)"
              echo "  - Health probes (startup, readiness, liveness)"
              echo "=========================================="
            displayName: 'Print deployment summary'
